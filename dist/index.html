<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="上传日麻手牌截图，计算向听、进张、宝牌和防守，比较切牌与役满路线。">
<title>牌研所 · 日麻牌效率分析</title>
<link rel="stylesheet" href="style.css">
<script defer src="engine.js"></script>
<script defer src="vision.js"></script>
<script defer src="board-templates.js"></script>
<script defer src="board-vision.js"></script>
<script defer src="app.js"></script>
</head>
<body>
<header class="bar"><div class="shell brand"><span class="seal">牌</span><b>牌研所</b><span class="divider"></span><span>日麻牌效率分析</span></div></header>
<main class="shell">
  <section class="hero">
    <div><p class="kicker">仅支持雀魂 · 三麻与四麻</p><h1>这一巡，<em>切哪张？</em></h1><p>上传自摸或吃碰后待切牌的雀魂整桌截图，比较进张、宝牌和切牌风险。</p><button id="demo" class="demo">试用示例</button></div>
    <div class="hero-tiles" id="hero-tiles" aria-hidden="true"></div>
  </section>
  <div class="workbench">
    <section class="panel input-panel">
      <h2>输入牌局</h2>
      <label class="drop" id="drop" for="file"><b>上传雀魂整桌截图</b><span>保留左上角宝牌、中央牌桌、手牌和副露区</span></label>
      <input type="file" id="file" accept="image/*" class="visually-hidden">
      <div id="vision" hidden>
        <p id="vision-status" class="sub" role="status"></p>
        <div id="read-board"></div>
        <div class="photo"><canvas id="preview" aria-label="上传的雀魂截图" hidden></canvas><div id="markers"></div></div><div id="correction"></div>
        <button type="button" id="manual" class="demo">切换到手动录入</button>
      </div>
      <form id="form">
        <label for="players">牌局人数</label><select id="players"><option value="4">四麻</option><option value="3">三麻</option></select><label id="melds-label" for="melds">自己的明副露（每组用空格分隔）</label><input id="melds" placeholder="例如 123p 777s 5555z"><label id="called-label" for="called" hidden>刚吃碰的那张牌（最新副露填在最后一组）</label><input id="called" hidden placeholder="例如 3p 或 5z"><label for="north">自己已拔北的枚数（三麻）</label><input id="north" type="number" min="0" max="4" value="0"><div class="form-label"><label for="hand">未副露手牌</label><span id="tile-count">0 / 14</span></div>
        <input id="hand" placeholder="123456m345p67789s" autocomplete="off" spellcheck="false" required>
        <div class="tiles hand" id="hand-tiles"></div>
        <details><summary>用牌面录入</summary><div id="palette"></div></details>
        <p class="sub" id="manual-hint">m 万、p 筒、s 索、z 字牌（东南西北白发中依次为 1–7），0 表示赤五。点击手牌可移除。</p>
        <label for="indicators">宝牌指示牌</label>
        <input id="indicators" placeholder="例如 4p（宝牌为 5 筒）" autocomplete="off">
        <details id="board"><summary>牌河、可见牌与立直状态</summary>
          <div class="board-grid">
            <label>上家牌河<input id="river0" placeholder="例如 19m27p"></label><label class="check"><input type="checkbox" id="ready0">上家立直</label>
            <label>对家牌河<input id="river1" placeholder="例如 147s"></label><label class="check"><input type="checkbox" id="ready1">对家立直</label>
            <label>下家牌河<input id="river2" placeholder="例如 123z"></label><label class="check"><input type="checkbox" id="ready2">下家立直</label>
          </div>
          <label for="own">自家牌河</label><input id="own" placeholder="用于判断舍牌振听">
          <label for="extra">其他可见牌</label><input id="extra" placeholder="例如副露中尚未记录的牌，每张只录入一次">
          <label class="check"><input id="locked" type="checkbox">我已立直（手牌最后一张为本巡摸牌）</label>
        </details>
        <details><summary>攻守与顺位</summary><label>局数<select id="round"><option value="">未指定</option><option>东1局</option><option>东2局</option><option>东3局</option><option>东4局</option><option>南1局</option><option>南2局</option><option>南3局</option><option>南4局</option></select></label><label>自风<select id="wind"><option value="">未指定</option><option value="27">东</option><option value="28">南</option><option value="29">西</option><option value="30">北</option></select></label><label>各家点数（自己在前）<input id="scores" placeholder="32000 28000 22000 18000"></label><label>剩余牌数<input id="remaining" type="number" min="0" max="70"></label><label class="check"><input type="checkbox" id="guard0">防守上家</label><label>上家可见副露<input id="shown0" placeholder="例如 555z（勿与其他可见牌重复）"></label><label class="check"><input type="checkbox" id="guard1">防守对家</label><label>对家可见副露<input id="shown1" placeholder="例如 555z（勿与其他可见牌重复）"></label><label class="check"><input type="checkbox" id="guard2">防守下家</label><label>下家可见副露<input id="shown2" placeholder="例如 555z（勿与其他可见牌重复）"></label></details><label for="mode">推荐策略</label>
        <select id="mode"><option value="balanced">攻守平衡</option><option value="efficiency">牌效率优先</option><option value="defense">防守优先</option></select>
        <button class="primary" type="submit">分析切牌</button>
        <p id="error" class="error" role="alert" hidden></p>
      </form>
    </section>
    <section class="panel results-panel" aria-labelledby="results-title">
      <div class="results-heading"><h2 id="results-title">切牌推荐</h2><span class="tag">前三选择</span></div>
      <div id="results" aria-live="polite">
        <div class="empty"><div class="empty-icons" id="empty-tiles" aria-hidden="true"></div><h3>等待手牌</h3><p>上传完整雀魂截图或输入 手牌与副露后，即可比较切牌方案。</p></div>
      </div>
    </section>
  </div>
  <footer><span>适用于雀魂三麻、四麻摸牌后的切牌分析。图片由当前浏览器处理。</span><a href="https://mahjong-europe.org/portal/images/docs/Riichi-rules-2025-EN.pdf" target="_blank" rel="noopener">参照 EMA 立直麻将规则</a></footer>
</main>
</body>
</html>
